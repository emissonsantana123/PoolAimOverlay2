
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar projeto Android
        run: flutter create --platforms=android --project-name pool_aim_overlay_smart .

      - name: Instalar dependências
        run: flutter pub get

      - name: Executar testes
        run: flutter test

      - name: Gerar APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: PoolAimOverlaySmart-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
